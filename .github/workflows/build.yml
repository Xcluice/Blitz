name: Build Blitz release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing keystore
        run: base64 -d app/blitz.jks.b64 > app/blitz.jks

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace -PappCode=${{ github.run_number }} -PappVersion=0.1.${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk XcluiceBlitz-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XcluiceBlitz-release-apk
          path: XcluiceBlitz-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Xcluice Blitz v0.1.${{ github.run_number }}
          files: XcluiceBlitz-release.apk
